<div class="header">
    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matNativeControl input="text" [formField]="stateForm.name" />
    </mat-form-field>

    <div class="spacer"></div>

    <button matButton="" (click)="resetForm()">New</button>
    <button matButton="filled" (click)="savePreset()">Save Preset</button>
</div>

<div class="color-list">
    @for (color of stateForm.colors; track color; let ci = $index) {
        <div class="color">
            <mat-toolbar>
                <h2>{{color.name().value()}}</h2>
                @if (ci > 0) {
                    <button matIconButton aria-label="Remove color" (click)="removeColor(ci)">
                        <mat-icon>remove</mat-icon>
                    </button>
                }
            </mat-toolbar>
            <div class="control">
                <mat-label>Hue</mat-label>
                <mat-slider min="1" max="360" step="1" discrete [disabled]="color.lockHue().value()">
                    <input matSliderThumb [formField]="color.hue" >
                </mat-slider>

                @if (ci > 0) {
                    <mat-checkbox [formField]="color.lockHue"></mat-checkbox>
                }
            </div>
            <div class="control">
                <mat-label>Saturation</mat-label>
                <mat-slider min="0" max="1" step="0.01" discrete [disabled]="color.lockSaturation().value()">
                    <input matSliderThumb [formField]="color.saturation" >
                </mat-slider>

                @if (ci > 0) {
                    <mat-checkbox [formField]="color.lockSaturation"></mat-checkbox>
                }
            </div>
            <div class="shades">

                @for (shade of color.shades; track $index; let si = $index) {
                    <mat-form-field appearance="fill">
                        <button matSuffix class="top-right-icon" matIconButton aria-label="Remove shade" (click)="removeShade(ci,si)" [disabled]="color.lockShade().value()">
                            <mat-icon>remove</mat-icon>
                        </button>
                        <input matInput type="number" step="0.01" [formField]="shade">
                    </mat-form-field>
                }
                <button matButton aria-label="Add shade" (click)="addShade(ci)" [disabled]="color.lockShade().value()">
                    Add shade
                    <mat-icon matSuffix >add</mat-icon>
                </button>

                @if (ci > 0) {
                    <mat-checkbox [formField]="color.lockShade"></mat-checkbox>
                }
            </div>
        </div>
    }
</div>

<button matButton aria-label="Add color" (click)="addColor()">
    Add color
    <mat-icon matSuffix >add</mat-icon>
</button>
