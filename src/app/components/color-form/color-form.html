
@for (color of stateForm.colors; track $index; let ci = $index) {
<div class="color">
    <mat-toolbar>
        <h2>Color {{ci}}</h2>
        @if (!singleColor()) {
            <button matIconButton aria-label="Remove color" (click)="removeColor(ci)">
                <mat-icon>remove</mat-icon>
            </button>
        }
    </mat-toolbar>
    <div class="control">
        <mat-label>Hue</mat-label>
        <mat-slider min="1" max="360" step="1">
            <input matSliderThumb [formField]="color.hue" >
        </mat-slider>
    </div>
    <div class="shades">

        @for (shade of color.shades; track $index; let si = $index) {
            <mat-form-field appearance="fill" >
                <button matSuffix class="top-right-icon" matIconButton aria-label="Remove shade" (click)="removeShade(ci,si)">
                    <mat-icon>remove</mat-icon>
                </button>
                <input matInput type="number" step="0.01" [formField]="shade">
            </mat-form-field>
        }
        <button matButton aria-label="Add shade" (click)="addShade(ci)">
            Add shade
            <mat-icon matSuffix >add</mat-icon>
        </button>
    </div>
</div>
}

<button matButton aria-label="Add color" (click)="addColor()">
    Add color
    <mat-icon matSuffix >add</mat-icon>
</button>
