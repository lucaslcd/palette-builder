<h2 mat-dialog-title>Export palette {{palette().name}}</h2>
<mat-dialog-content>
    <div class="fieldset">
        <mat-form-field>
            <mat-label>Export type:</mat-label>
            <mat-select [formField]="exportForm.export.type">
                <mat-option value="bitmap">Bitmap</mat-option>
                <mat-option value="json">JSON</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    @if(exportForm.export.type().value() === "bitmap") {
        <div class="fieldset">
            <mat-form-field>
                <mat-label>Image format:</mat-label>
                <mat-select [formField]="exportForm.export.format">
                    <mat-option value="png">PNG</mat-option>
                </mat-select>
            </mat-form-field>
            
            <mat-form-field>
                <mat-label>Disposition:</mat-label>
                <mat-select [formField]="exportForm.export.disposition">
                    <mat-option value="sat-hua.lig">Saturation > Hue (angle) x Light</mat-option>
                    <mat-option value="sat-hut.lig">Saturation > Hue (temperature) x Light</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    }
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="{success: false}">Cancel</button>
  <button matButton="filled" [mat-dialog-close]="{success: true}" cdkFocusInitial>Export</button>
</mat-dialog-actions>
