<pbu-header></pbu-header>

<div class="col-palette">
  <mat-select [formField]="display.color">
    <mat-option value="wheel">Color Wheel</mat-option>
    <mat-option value="strips">Strips</mat-option>
  </mat-select>

  @switch(display.color().value()) {
    @case ('wheel') {
      <pbu-color-wheel></pbu-color-wheel>
    }
    @case ('strips') {
      <pbu-color-strips></pbu-color-strips>
    }
  }
</div>

<div class="col-colors">
  <mat-select [formField]="display.form">
    <mat-option value="edit">Build Palette</mat-option>
    <mat-option value="presets">Preset List</mat-option>
  </mat-select>

  @switch(display.form().value()) {
    @case ('edit') {
      <pbu-color-form></pbu-color-form>
    }
    @case ('presets') {
      <pbu-preset-list></pbu-preset-list>
    }
  }
</div>
